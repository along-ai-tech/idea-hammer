name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  contract-tests:
    name: Skill 契约测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
      
      - name: 装依赖
        run: uv sync
      
      - name: 跑契约测试
        run: uv run pytest tests/contract/ -v
      
      - name: 校验 skill 结构
        run: python3 scripts/check_skill_structure.py --strict
      
      - name: 校验框架代码简洁度
        run: python3 scripts/check_simplicity.py scripts/

      - name: 校验示例需求追踪链路
        run: python3 scripts/check_traceability.py --project examples/personal-blog

      - name: 校验示例 Spec 四要素标准
        run: python3 scripts/check_spec_standard.py --project examples/personal-blog
      
      - name: 校验 session.json
        run: |
          python3 scripts/session.py validate
          python3 scripts/session.py context > /dev/null
          python3 scripts/session.py restore > /dev/null

      - name: 全局安装冒烟（装到临时目录，不碰真实 ~/.codex）
        run: |
          TMP=$(mktemp -d)
          export HOME="$TMP/home"
          mkdir -p "$HOME"
          python3 scripts/install_global.py install --source "$PWD" --codex-home "$TMP/codex"
          test -f "$TMP/codex/idea-hammer/AGENTS.md"
          test -f "$TMP/codex/AGENTS.md"
          test -f "$TMP/codex/hooks.json"
          test -f "$TMP/codex/config.toml"
          test -d "$HOME/.agents/skills/dev-builder"
          grep -q "hooks.state" "$TMP/codex/config.toml"
  
  example-tests:
    name: Example 后端 + 前端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 后端测试
        working-directory: examples/personal-blog/backend
        run: |
          pip install uv
          uv sync --extra dev
          uv run pytest -v

      - name: 前端测试
        working-directory: examples/personal-blog/frontend
        run: |
          npm ci || npm install
          npx vitest run
          npm run build
